<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Game X/O Đơn Giản</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
    }
    h1 { margin-bottom: 10px; }
    #status {
      font-size: 1.2rem;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 5px;
      background-color: #333;
      padding: 5px;
      border-radius: 8px;
    }
    .cell {
      width: 100px;
      height: 100px;
      background-color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .cell:hover { background-color: #e9e9e9; }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
    }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <h1>Game Cờ X/O</h1>
  <div id="status">Lượt của: X</div>
  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>
  <button onclick="resetGame()">Chơi lại</button>

  <script>
    let boardState = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let isGameActive = true;

    const winningConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Hàng ngang
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Hàng dọc
      [0, 4, 8], [2, 4, 6]             // Đường chéo
    ];

    const statusDisplay = document.getElementById("status");
    const cells = document.querySelectorAll(".cell");

    cells.forEach(cell => {
      cell.addEventListener("click", handleCellClick);
    });

    function handleCellClick(e) {
      const clickedCell = e.target;
      const index = parseInt(clickedCell.getAttribute("data-index"));

      if (boardState[index] !== "" || !isGameActive) return;

      boardState[index] = currentPlayer;
      clickedCell.textContent = currentPlayer;

      checkResult();
    }

    function checkResult() {
      let roundWon = false;

      for (let condition of winningConditions) {
        const [a, b, c] = condition;
        if (boardState[a] === "" || boardState[b] === "" || boardState[c] === "") continue;
        if (boardState[a] === boardState[b] && boardState[b] === boardState[c]) {
          roundWon = true;
          break;
        }
      }

      if (roundWon) {
        statusDisplay.textContent = `Người chơi ${currentPlayer} thắng! 🎉`;
        isGameActive = false;
        return;
      }

      if (!boardState.includes("")) {
        statusDisplay.textContent = "Hòa rồi! 🤝";
        isGameActive = false;
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      statusDisplay.textContent = `Lượt của: ${currentPlayer}`;
    }

    function resetGame() {
      boardState = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      isGameActive = true;
      statusDisplay.textContent = "Lượt của: X";
      cells.forEach(cell => cell.textContent = "");
    }
  </script>
</body>
</html>
